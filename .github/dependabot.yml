version: 2
updates:
  # Maven dependencies for the lesson-runner app
  - package-ecosystem: "maven"
    directory: "/lesson-runner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    groups:
      # Bundle low-risk minor/patch bumps into one PR; major bumps stay separate
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Bundle all GitHub Actions updates into a single PR
      github-actions:
        patterns:
          - "*"
